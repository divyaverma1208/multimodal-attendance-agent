# Nginx Reverse Proxy Configuration for Classroom Agent
# Target: https://your-classroom-agent.example.com
# Replace 'your-classroom-agent.example.com' with your actual domain or subdomain.

server {
    listen 80;
    server_name your-classroom-agent.example.com;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name your-classroom-agent.example.com;

    # SSL Certificate files (managed automatically by certbot)
    ssl_certificate /etc/letsencrypt/live/your-classroom-agent.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-classroom-agent.example.com/privkey.pem;

    # Modern SSL security parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Support classroom video uploads up to 500MB
    client_max_body_size 500M;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # Streamlit Main Application Reverse Proxy
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # WebSocket support for continuous video and real-time telemetry
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Streamlit WebSocket and Event Stream Endpoints
    location ^~ /_stcore/stream {
        proxy_pass http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
}
